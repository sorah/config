# The global tool set, and the settings that govern it.
#
# Deployed to ~/.config/mise/conf.d/sorah-tools.toml by the [dotfiles] entry in
# ../mise.toml, so these apply in every directory. Declaring them in
# ../mise.toml instead would scope them to ~/git/config only.
#
# The filename matters. mise/config.toml and mise/conf.d/*.toml would load as
# project config for this repo. tools.toml is only active once deployed.
#
# ~/.config/mise/config.toml overrides conf.d fragments and `mise use -g`
# writes there, so an ad-hoc `-g` install shadows this file.

# paranoid cannot live here, since mise trusts this file before parsing it.
# disable_tools stays alongside it in ~/.config/mise/config.toml, being per
# machine.
[settings]
experimental = true
lockfile = true
idiomatic_version_file_enable_tools = ["node"]

# Applies to the npm: entries below. bun itself is declared in [tools].
[settings.npm]
package_manager = "bun"

[tool_alias]
trustless = "ubi:sorah/trustless[tag_regex='^trustless/v']"
trustless-provider-lambda = "ubi:sorah/trustless[tag_regex='^trustless-provider-lambda/v']"
smithy = "github:smithy-lang/smithy[bin_path=bin,bin=smithy,strip_components=1]"
smithy-language-server = "github:smithy-lang/smithy-language-server[bin_path=bin,bin=smithy-language-server]"

[tools]
"1password" = "latest"
"aqua:astral-sh/rye" = "latest"
"aqua:astral-sh/uv" = "latest"
"aqua:suzuki-shunsuke/pinact" = "latest"
# The short name `aws-cli` resolves to a different tool and would pour a
# second copy.
"aqua:aws/aws-cli" = "latest"
bun = "latest"
buf = "latest"
gcloud = "latest"
node = "lts"
"pipx:aws-sam-cli" = "latest"
terraform = "latest"
"ubi:kagehq/port-kill" = "latest"
"ubi:sorah/mairu" = "latest"

"npm:@google/gemini-cli" = "latest"
"npm:@playwright/mcp" = "latest"
"npm:difit" = "latest"

mysqldef = "latest"
psqldef = "latest"
sqlite3def = "latest"

deno = "latest"
pnpm = "latest"
ubi = "latest"
watchexec = "latest"
"aqua:fujiwara/lambroll" = "latest"
"github:aviator-co/av" = "latest"
"github:databricks/cli" = "latest"
"github:grafana/jsonnet-language-server" = "latest"

"npm:@devcontainers/cli" = "latest"
"npm:@playwright/cli" = "latest"
"npm:ccusage" = "latest"
"npm:portless" = "latest"
"npm:skills" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:@esaio/esa-mcp-server" = "latest"

actionlint = "latest"
glab = "latest"
helm = "latest"
hk = "latest"
k9s = "latest"
neonctl = "latest"
oras = "latest"
pkl = "latest"
zig = "latest"
zizmor = "latest"
"github:draftcode/aws-gcp-token" = "latest"
"ubi:ayinke-llc/sdump" = "latest"

"cargo:bpf-linker" = "latest"
"cargo:cargo-binstall" = "latest"
"cargo:cargo-generate" = "latest"
"cargo:eza" = "latest"

# jrsonnet has no 0.5.0 final, and the three crates share one workspace.
"cargo:jrsonnet" = "0.5.0-pre98"
"cargo:jrsonnet-deps" = "0.5.0-pre98"
"cargo:jrsonnet-fmt" = "0.5.0-pre98"

smithy = "latest"
smithy-language-server = "latest"

# mise's AUR backend shells out to this for the aur: entries in ../mise.toml.
# ubi rejects yay's release assets, whose names carry no OS token, hence the
# github backend.
"github:Jguer/yay" = { version = "latest", os = ["linux"] }

# macOS only. On Arch these come from pacman, in [bootstrap.packages] in
# ../mise.toml.
"aqua:BurntSushi/ripgrep" = { version = "latest", os = ["macos"] }
"aqua:cloudflare/cloudflared" = { version = "latest", os = ["macos"] }
"aqua:junegunn/fzf" = { version = "latest", os = ["macos"] }
"aqua:neovim/neovim" = { version = "latest", os = ["macos"] }
"aqua:protocolbuffers/protobuf/protoc" = { version = "latest", os = ["macos"] }
"aqua:x-motemen/ghq" = { version = "latest", os = ["macos"] }
"core:go" = { version = "latest", os = ["macos"] }
# Built from source with the go above. aqua's golang/tools/gopls is a
# go_install package, which mise's aqua backend rejects.
"go:golang.org/x/tools/gopls" = { version = "latest", os = ["macos"] }
github-cli = { version = "latest", os = ["macos"] }
python = { version = "latest", os = ["macos"] }

# Shadows macOS's own /usr/bin/jq. Arch gets jq from pacman.
"aqua:jqlang/jq" = { version = "latest", os = ["macos"] }
