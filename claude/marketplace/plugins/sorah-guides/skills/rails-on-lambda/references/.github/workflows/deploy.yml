# Excerpt: the build and deploy jobs of a push-to-main workflow.
jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image-uri: "${{ steps.login-ecr.outputs.registry }}/myapp:${{ github.sha }}"
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-west-2
          role-to-assume: "arn:aws:iam::111122223333:role/GhaDockerPush"
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - run: echo "${GITHUB_SHA}" > REVISION
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: "${{ steps.login-ecr.outputs.registry }}/myapp:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Lambda rejects an image index; attestations would turn the tag into one.
          provenance: false
          sbom: false

  deploy:
    needs: [build, test]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-slim
    timeout-minutes: 30
    concurrency:
      group: production
      cancel-in-progress: true
    environment:
      name: production
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/deploy/Gemfile"
      IMAGE_URI: "${{ needs.build.outputs.image-uri }}"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd # v1.288.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-west-2
          role-to-assume: "arn:aws:iam::111122223333:role/GhaMyAppDeploy"
      # Migrate before the web and job functions run code that expects the new schema.
      - run: aws lambda update-function-code --function-name myapp-runner-prd --image-uri "$IMAGE_URI" && aws lambda wait function-updated --function-name myapp-runner-prd
      - run: bundle exec ./deploy/lambrunner.rb myapp-runner-prd bundle exec rake db:migrate
      - run: aws lambda update-function-code --function-name myapp-lambdakiq-prd --image-uri "$IMAGE_URI" && aws lambda wait function-updated --function-name myapp-lambdakiq-prd
      - run: aws lambda update-function-code --function-name myapp-web-prd --image-uri "$IMAGE_URI" && aws lambda wait function-updated --function-name myapp-web-prd
